[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alarmclock-cli"
version = "2.0.0"
description = "A dependency-free terminal alarm clock"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
alarm = "alarmclock.cli:main"

[tool.setuptools]
packages = ["alarmclock"]
